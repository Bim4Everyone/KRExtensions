title:
  ru: Ограждение лестниц
  en_us: Stair railing

tooltip:
  ru: >-
    Строит ограждение лестницы КМ из семейств «Каркас несущий»:
    стойки, поручень, продольные прутки, опорные пластины и анкеры.

    1. Запустить плагин, выбрать типоразмеры и размеры пролёта;

    2. Нажать «Выбрать линии и построить»;

    3. Выбрать линии модели по краю маршей и площадок и нажать «Готово».

    Ограждение собирается в сборку со следующим свободным номером.
  en_us: >-
    Builds a stair railing from structural framing families:
    posts, handrail, longitudinal rods, base plates and anchors.

    1. Start the plugin, choose the types and span dimensions;

    2. Press "Select lines and build";

    3. Select the model lines along the flight and landing edges and press Finish.

    The railing is collected into an assembly with the next free number.

assembly: RevitStairRailing.dll
command_class: RevitStairRailingCommand

author: VoytenkovD

min_revit_version: 2022
max_revit_version: 2024
